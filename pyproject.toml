[project]
name = "roman-lcs"
version = "0.5.0"
description = "Tools to compute PSF photometry with Roman simulated data"
authors = [{name = "Jorge Martinez-Palomera", email = "jorgemarpa@ug.uchile.cl"}]
license = {text = "MIT"}
readme = "docs/README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2.5",
    "scipy>=1.10",
    "pandas>1.5,<3.0",
    "astropy>5,<8",
    "tqdm>=4.67.1,<5.0",
    "matplotlib>=3.10.1,<4.0",
    "patsy>=0.5.1",
    "fitsio>=1.1.3",
    "stpsf>=2.2.0",
    "asdf-astropy>=0.7",
    "roman-datamodels>=1.0.0,<2.0",
    "roman-cuts[com]",
    "roman-epsf",
]

[project.scripts]
roman-lc-extract = "roman_lcs.scripts.extract_lightcurve:main"
roman-lc-extract-batch = "roman_lcs.scripts.extract_batch_lightcurves:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0",
    "ruff>=0.11.0,<0.12",
    "mypy>=1.15.0,<2.0",
    "mkdocs>=1.6.0,<2.0",
    "mkdocs-material>=9.5.0,<10.0",
    "mkdocstrings[python]>=0.29.0,<0.30",
    "mkdocs-jupyter>=0.25.1,<0.26",
    "pymdown-extensions<10.15",
]

[tool.uv.sources]
roman-cuts = { git = "https://github.com/jorgemarpa/roman-cuts.git", branch = "chore/uv-cleanup" }
roman-epsf = { git = "https://github.com/jorgemarpa/roman-epsf.git", branch = "chore/uv-cleanup" }
astroquery = { git = "https://github.com/astropy/astroquery.git", rev = "refs/pull/3593/head" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roman_lcs"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
ignore_missing_imports = true
disable_error_code = [
    "import-untyped",
    "index",
    "union-attr",
    "arg-type",
    "assignment",
    "list-item",
    "var-annotated",
    "operator",
    "call-overload",
    "has-type",
    "attr-defined",
    "type-var",
]
