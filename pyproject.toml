[tool.poetry]
name = "roman-lcs"
version = "0.5.0"
description = "Tools to compute PSF photometry with Roman simulated data"
authors = ["Jorge Martinez-Palomera <jorgemarpa@ug.uchile.cl>"]
license = "MIT"
readme = "docs/README.md"
packages = [{include = "roman_lcs", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
numpy = ">=1.26,<2.5"
scipy = ">=1.10"
pandas = ">1.5,<3.0"
astropy = ">5,<8"
tqdm = "^4.67.1"
matplotlib = "^3.10.1"
patsy = "^0.5.1"
lightkurve = "^2.0"
fitsio = "^1.1.3"
stpsf = ">=2.2.0"
asdf-astropy = ">=0.7"
roman-datamodels = "^1.0.0"

roman-cuts = {git = "https://github.com/jorgemarpa/roman-cuts.git", branch = "romcom"}
roman-epsf = {git = "https://github.com/jorgemarpa/roman-epsf.git"}

[tool.poetry.scripts]
roman-lc-extract = "roman_lcs.scripts.extract_lightcurve:main"
roman-lc-extract-batch = "roman_lcs.scripts.extract_batch_lightcurves:main"

[tool.poetry.group.dev.dependencies]
mkdocs = "^1.6.0"
mkdocstrings = {version = "^0.29.0", extras = ["python", "numpy-style"]}
mkdocs-material = "^9.5.33"
mkdocs-jupyter = "^0.25.1"
ruff = "^0.6.2"
pytest = "^8.3.2"
mypy = "^1.11.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# Assumes Python 3.10
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (`F`), a subset of pycodestyle (`E`) and isort (`I`).
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
plugins = "numpy.typing.mypy_plugin"